[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thoracic-disease-detection"
version = "0.1.0"
description = "Interpretable thoracic disease classification with DenseNet-121 and ViT"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Sethu Ram Reddy Lankala"}
]
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "iterative-stratification>=0.1.9",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "tqdm>=4.66,<5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
